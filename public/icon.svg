<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="displayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="btnOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="btnDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <!-- Background Icon Frame -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="500" height="500" x="6" y="6" rx="106" fill="none" stroke="#475569" stroke-width="4" opacity="0.5" />

  <!-- Calculator Screen -->
  <rect x="64" y="64" width="384" height="96" rx="20" fill="url(#displayGrad)" stroke="#475569" stroke-width="3" />
  <text x="420" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="700" fill="#f8fafc" text-anchor="end">0</text>

  <!-- Keypad Grid -->
  <!-- Row 1 -->
  <rect x="64" y="190" width="80" height="60" rx="16" fill="url(#btnDark)" />
  <text x="104" y="232" font-family="sans-serif" font-size="28" font-weight="600" fill="#94a3b8" text-anchor="middle">C</text>

  <rect x="165" y="190" width="80" height="60" rx="16" fill="url(#btnDark)" />
  <text x="205" y="232" font-family="sans-serif" font-size="28" font-weight="600" fill="#94a3b8" text-anchor="middle">±</text>

  <rect x="266" y="190" width="80" height="60" rx="16" fill="url(#btnDark)" />
  <text x="306" y="232" font-family="sans-serif" font-size="28" font-weight="600" fill="#94a3b8" text-anchor="middle">%</text>

  <rect x="367" y="190" width="81" height="60" rx="16" fill="url(#btnOrange)" />
  <text x="407" y="232" font-family="sans-serif" font-size="32" font-weight="600" fill="#ffffff" text-anchor="middle">÷</text>

  <!-- Row 2 -->
  <rect x="64" y="265" width="80" height="60" rx="16" fill="url(#btnDark)" />
  <text x="104" y="307" font-family="sans-serif" font-size="28" font-weight="600" fill="#f8fafc" text-anchor="middle">7</text>

  <rect x="165" y="265" width="80" height="60" rx="16" fill="url(#btnDark)" />
  <text x="205" y="307" font-family="sans-serif" font-size="28" font-weight="600" fill="#f8fafc" text-anchor="middle">8</text>

  <rect x="266" y="265" width="80" height="60" rx="16" fill="url(#btnDark)" />
  <text x="306" y="307" font-family="sans-serif" font-size="28" font-weight="600" fill="#f8fafc" text-anchor="middle">9</text>

  <rect x="367" y="265" width="81" height="60" rx="16" fill="url(#btnOrange)" />
  <text x="407" y="307" font-family="sans-serif" font-size="30" font-weight="600" fill="#ffffff" text-anchor="middle">×</text>

  <!-- Row 3 -->
  <rect x="64" y="340" width="80" height="60" rx="16" fill="url(#btnDark)" />
  <text x="104" y="382" font-family="sans-serif" font-size="28" font-weight="600" fill="#f8fafc" text-anchor="middle">4</text>

  <rect x="165" y="340" width="80" height="60" rx="16" fill="url(#btnDark)" />
  <text x="205" y="382" font-family="sans-serif" font-size="28" font-weight="600" fill="#f8fafc" text-anchor="middle">5</text>

  <rect x="266" y="340" width="80" height="60" rx="16" fill="url(#btnDark)" />
  <text x="306" y="382" font-family="sans-serif" font-size="28" font-weight="600" fill="#f8fafc" text-anchor="middle">6</text>

  <rect x="367" y="340" width="81" height="60" rx="16" fill="url(#btnOrange)" />
  <text x="407" y="382" font-family="sans-serif" font-size="32" font-weight="600" fill="#ffffff" text-anchor="middle">-</text>

  <!-- Row 4 -->
  <rect x="64" y="415" width="181" height="60" rx="16" fill="url(#btnDark)" />
  <text x="154" y="457" font-family="sans-serif" font-size="28" font-weight="600" fill="#f8fafc" text-anchor="middle">0</text>

  <rect x="266" y="415" width="80" height="60" rx="16" fill="url(#btnDark)" />
  <text x="306" y="457" font-family="sans-serif" font-size="28" font-weight="600" fill="#f8fafc" text-anchor="middle">.</text>

  <rect x="367" y="415" width="81" height="60" rx="16" fill="url(#btnOrange)" />
  <text x="407" y="457" font-family="sans-serif" font-size="32" font-weight="600" fill="#ffffff" text-anchor="middle">=</text>
</svg>
